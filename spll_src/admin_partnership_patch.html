      <div class="panel"><div class="ph"><h3>締結済み契約から利用許諾報告を起票</h3><span class="hint">契約第9条3項／期限は締結月の翌月末で自動設定</span></div><div class="part-form"><div class="row"><div><label>契約ID</label><input id="prc-contract" placeholder="CON-..."></div><div><label>報告するパートナー</label><select id="prc-partner"></select></div><div style="grid-column:span 2;align-self:end"><button class="btn p" onclick="partReportFromContract()">報告を起票</button></div></div></div></div>
      <div class="panel"><div class="ph"><h3>報告を登録</h3></div><div class="part-form"><div class="row"><div><label>種別</label><select id="pr-type"><option value="LICENSE_AGREEMENT">利用許諾報告</option><option value="VENDOR_EVALUATION">推奨業者年次評価</option><option value="EXPENSE_REPORT">費用報告</option><option value="OTHER">その他</option></select></div><div><label>パートナー</label><select id="pr-partner"></select></div><div><label>期限</label><input type="date" id="pr-due"></div><div><label>状態</label><select id="pr-status"><option>DRAFT</option><option>SUBMITTED</option><option>REVIEWED</option><option>CLOSED</option></select></div></div><div><label>件名</label><input id="pr-subject"></div><div class="row two"><div><label>ライセンス・対象</label><textarea id="pr-license"></textarea></div><div><label>利用目的・報告内容</label><textarea id="pr-usage"></textarea></div></div><div class="row"><div><label>利用許諾料等</label><input id="pr-fee"></div><div><label>資料URL</label><input id="pr-url"></div><div style="grid-column:span 2"><label>メモ</label><input id="pr-notes"></div></div><button class="save" onclick="partSaveReport()">報告を保存</button></div></div>
      <div class="panel"><div class="ph"><h3>四半期清算・費用負担記録</h3><span class="hint">計算/入金処理ではなく事務局の報告・決議・支払記録</span></div><table><thead><tr><th>期間</th><th>パートナー</th><th>分配額</th><th>費用負担</th><th>差引</th><th>期限</th><th>状態</th></tr></thead><tbody id="part-settlements"></tbody></table></div>
      <div class="panel"><div class="ph"><h3>清算記録を登録</h3></div><div class="part-form"><div class="row"><div><label>期間ラベル</label><input id="ps-label" placeholder="2026 Q3"></div><div><label>パートナー</label><select id="ps-partner"></select></div><div><label>期限</label><input type="date" id="ps-due"></div><div><label>状態</label><select id="ps-status"><option>DRAFT</option><option>REPORTED</option><option>APPROVED</option><option>PAID</option><option>CLOSED</option></select></div></div><div class="row"><div><label>収益総額</label><input type="number" id="ps-revenue"></div><div><label>分配額</label><input type="number" id="ps-dist"></div><div><label>費用負担額</label><input type="number" id="ps-expense"></div><div><label>差引額（空欄なら自動）</label><input type="number" id="ps-net"></div></div><div class="row two"><div><label>分配基準・決議</label><textarea id="ps-basis"></textarea></div><div><label>メモ</label><textarea id="ps-notes"></textarea></div></div><button class="save" onclick="partSaveSettlement()">清算記録を保存</button></div></div>
    </div>
    <div class="part-pane" id="pp-member">

      <div class="panel"><div class="ph"><h3>構成員を登録</h3></div><div class="part-form"><div class="row"><div><label>パートナーID</label><input id="pp-partner-id"></div><div><label>パートナー名</label><input id="pp-partner-name"></div><div><label>種別</label><select id="pp-type"><option value="CORE">コア</option><option value="CONTENT">コンテンツ</option></select></div><div><label>状態</label><select id="pp-status"><option>ACTIVE</option><option>INACTIVE</option></select></div></div><div class="row"><div><label>構成員名</label><input id="pp-name"></div><div><label>メール</label><input id="pp-email"></div><div><label>議決権</label><select id="pp-vote"><option value="true">あり</option><option value="false">なし</option></select></div><div><label>議長資格</label><select id="pp-chair"><option value="true">あり</option><option value="false">なし</option></select></div></div><button class="save" onclick="partSaveMember()">構成員を保存</button></div></div>
    </div>`;
  main.appendChild(sec);
  sec.querySelectorAll('.part-subtab').forEach(function(b){b.onclick=function(){sec.querySelectorAll('.part-subtab').forEach(function(x){x.classList.remove('on')});sec.querySelectorAll('.part-pane').forEach(function(x){x.classList.remove('on')});b.classList.add('on');document.getElementById('pp-'+b.dataset.p).classList.add('on');};});
})();

var PART_DATE=new Date(),PART_DATA=null,PART_MEETING='';
function partOpt(select,rows,valueKey,labelFn){if(!select)return;var cur=select.value;select.innerHTML='<option value="">—</option>';(rows||[]).forEach(function(r){var o=document.createElement('option');o.value=r[valueKey];o.textContent=labelFn(r);select.appendChild(o)});if(cur)select.value=cur;}
function partMoveMonth(d){PART_DATE=new Date(PART_DATE.getFullYear(),PART_DATE.getMonth()+d,1);loadPartnership();}
function loadPartnership(){call('admin_partnershipOverview',[PART_DATE.getFullYear(),PART_DATE.getMonth()+1],function(d){PART_DATA=d||{};var k=d.kpis||{};setText('pk-members',k.active_members);setText('pk-meetings',k.upcoming_meetings);setText('pk-agendas',k.open_agendas);setText('pk-reports',k.overdue_reports);setText('pk-settlements',k.pending_settlements);partRenderCalendar(d);partRenderMeetings(d);partRenderAgendas(d);partRenderReports(d);partRenderSettlements(d);partRenderMembers(d);partRefreshSelects(d);});}
function partRenderCalendar(d){var root=$('part-cal');if(!root)return;root.innerHTML='';['日','月','火','水','木','金','土'].forEach(function(x){var e=document.createElement('div');e.className='cal-dow';e.textContent=x;root.appendChild(e)});var y=d.year,m=d.month,first=new Date(y,m-1,1),last=new Date(y,m,0),start=first.getDay(),total=last.getDate(),ev={};(d.events||[]).forEach(function(x){(ev[x.date]=ev[x.date]||[]).push(x)});for(var i=0;i<start;i++){var q=document.createElement('div');q.className='cal-day muted';root.appendChild(q)}for(var day=1;day<=total;day++){var dt=y+'-'+String(m).padStart(2,'0')+'-'+String(day).padStart(2,'0'),c=document.createElement('div');c.className='cal-day';c.innerHTML='<div class="cal-date">'+day+'</div>';(ev[dt]||[]).forEach(function(x){var z=document.createElement('div');z.className='cal-item '+(x.kind==='MEETING'?'meeting':x.kind==='REPORT_DUE'?'report':'settle')+(x.overdue?' late':'');z.textContent=(x.overdue?'⚠ ':'')+x.title;c.appendChild(z)});root.appendChild(c)}$('part-month').textContent=y+'年 '+m+'月';}
function partRenderMeetings(d){var tb=$('part-meetings');tb.innerHTML='';var rows=d.meetings||[];if(!rows.length){emptyRow(tb,7,'会議予定はありません');return}rows.forEach(function(m){var tr=document.createElement('tr');tr.appendChild(td('<span class="id">'+esc(String(m.starts_at||'').replace('T',' ').slice(0,16))+'</span>'));tr.appendChild(td(esc(m.title)));tr.appendChild(td(esc(m.meeting_type)));var ch=(d.members||[]).find(function(x){return x.member_id===m.chair_member_id});tr.appendChild(td(esc(ch?ch.representative_name:'—')));var at=m.attendance||{};tr.appendChild(td(at.recorded?esc('出席'+(at.attended||0)+' / 欠席'+(at.absent||0)):'<span class="evi">未記録</span>'));tr.appendChild(td('<span class="pill wait">'+esc(m.status)+'</span>'));var a=document.createElement('td');a.className='actions';if(m.calendar_url)a.appendChild(mkBtn('Googleカレンダーに追加','btn',function(){window.open(m.calendar_url,'_blank')}));a.appendChild(mkBtn('出欠','btn',function(){partOpenAttendance(m)}));a.appendChild(mkBtn('編集','btn',function(){partEditMeeting(m)}));tr.appendChild(a);tb.appendChild(tr)});}
/** 出欠の記録。未記録の構成員も並べて、記録漏れがそのまま見えるようにする。 */
function partOpenAttendance(m){PART_MEETING=m.meeting_id;$('part-att-panel').style.display='';$('part-att-title').textContent=String(m.starts_at||'').replace('T',' ').slice(0,16)+' '+(m.title||'');call('admin_listSecretariatAttendance',[m.meeting_id],function(list){var tb=$('part-attendance');tb.innerHTML='';if(!list||!list.length){emptyRow(tb,4,'有効な構成員が登録されていません');return}list.forEach(function(a){var tr=document.createElement('tr');tr.appendChild(td(esc(a.representative_name)));tr.appendChild(td(esc(a.partner_name_snapshot||'—')));tr.appendChild(td(esc(a.partner_type||'')));var c=document.createElement('td'),sel=document.createElement('select');[['','未記録'],['ATTENDED','出席'],['ONLINE','オンライン出席'],['ABSENT','欠席'],['OBSERVER','陪席']].forEach(function(o){var op=document.createElement('option');op.value=o[0];op.textContent=o[1];sel.appendChild(op)});sel.value=a.attendance_status||'';sel.onchange=function(){if(!sel.value)return;call('admin_recordSecretariatAttendance',[PART_MEETING,a.member_id,sel.value],function(){toast('出欠を記録しました');loadPartnership();partOpenAttendance(m)})};c.appendChild(sel);tr.appendChild(c);tb.appendChild(tr)})});}
function partEditMeeting(m){$('pm-id').value=m.meeting_id||'';$('pm-title').value=m.title||'';$('pm-type').value=m.meeting_type||'REGULAR';$('pm-start').value=String(m.starts_at||'').slice(0,16);$('pm-end').value=String(m.ends_at||'').slice(0,16);$('pm-location').value=m.location||'';$('pm-online').value=m.online_url||'';$('pm-chair').value=m.chair_member_id||'';$('pm-status').value=m.status||'SCHEDULED';$('pm-notes').value=m.notes||'';}
function partSaveMeeting(){var x={meeting_id:$('pm-id').value,title:$('pm-title').value,meeting_type:$('pm-type').value,starts_at:$('pm-start').value,ends_at:$('pm-end').value,location:$('pm-location').value,online_url:$('pm-online').value,chair_member_id:$('pm-chair').value,status:$('pm-status').value,notes:$('pm-notes').value};call('admin_saveSecretariatMeeting',[x],function(){toast('会議を保存しました');$('pm-id').value='';loadPartnership()});}
function partRenderAgendas(d){var tb=$('part-agendas');tb.innerHTML='';var rows=d.agendas||[];if(!rows.length){emptyRow(tb,8,'議案はありません');return}rows.forEach(function(a){var mt=(d.meetings||[]).find(function(x){return x.meeting_id===a.meeting_id}),e=a.evaluation||{};var tr=document.createElement('tr');tr.appendChild(td(esc(mt?mt.title:a.meeting_id)));tr.appendChild(td(esc(a.agenda_no||'—')));tr.appendChild(td('<b>'+esc(a.title)+'</b><br><span class="evi">'+esc(a.contract_clause||'')+'</span>'));tr.appendChild(td(esc(a.agenda_type_label||a.agenda_type)));tr.appendChild(td('<span class="pill '+(e.passed?'pass':e.status==='NOT_PASSED'?'fail':'review')+'">'+esc(a.resolution_rule||'')+'</span>'));
  // 確定済みは確定時の集計（構成員が入退任しても動かない）、未確定は現在の構成員での判定
  tr.appendChild(td(esc((e.yes||0)+'賛成 / '+(e.total_members||0)+'名')+'<br><span class="evi">'+(e.source==='SNAPSHOT'?'確定時の集計':'現在の構成員で判定')+'</span>'));
  tr.appendChild(td(esc(a.final_result||e.status||a.status)+(String(a.chair_override)==='true'?'<br><span class="evi">議長裁量</span>':'')));
  var act=document.createElement('td');act.className='actions';if(a.decided_at)act.appendChild(mkBtn('決議を再開','btn',function(){partReopenAgenda(a)}));tr.appendChild(act);tb.appendChild(tr)});}
/** 確定した決議の訂正。理由必須・LEGAL_ADMINのみ・監査ログに残る。 */
function partReopenAgenda(a){var r=prompt('決議「'+a.title+'」を再開します。訂正の理由を入力してください。');if(!r)return;call('admin_reopenSecretariatAgenda',[a.agenda_id,r],function(){toast('決議を再開しました');loadPartnership()});}
function partSaveAgenda(){var x={meeting_id:$('pa-meeting').value,agenda_no:$('pa-no').value,agenda_type:$('pa-type').value,title:$('pa-title').value,contract_clause:$('pa-clause').value,summary:$('pa-summary').value,proposal_text:$('pa-proposal').value};call('admin_saveSecretariatAgenda',[x],function(r){toast('議案を保存しました（'+r.resolution_rule+'）');loadPartnership()});}
function partCastVote(){var a=$('pv-agenda').value,m=$('pv-member').value;if(!a||!m){toast('議案と構成員を選択してください',true);return}call('admin_castSecretariatVote',[a,m,$('pv-vote').value,$('pv-comment').value],function(r){toast('投票を記録：'+r.yes+' / '+r.total_members+' 賛成');loadPartnership()});}
function partFinalizeAgenda(){var a=$('pv-agenda').value;if(!a){toast('議案を選択してください',true);return}call('admin_finalizeSecretariatAgenda',[a,$('pf-result').value,$('pf-text').value,$('pf-chair').value==='true'],function(){toast('決議結果を確定しました');loadPartnership()});}
function partRenderReports(d){var tb=$('part-reports');tb.innerHTML='';var rows=d.reports||[];if(!rows.length){emptyRow(tb,6,'報告記録はありません');return}rows.forEach(function(r){var tr=document.createElement('tr');tr.appendChild(td('<span class="id">'+esc(r.due_date||'—')+'</span>'));tr.appendChild(td(esc(r.report_type)));tr.appendChild(td(esc(r.partner_name_snapshot||r.partner_id||'—')));tr.appendChild(td(esc(r.subject||'—')));tr.appendChild(td(esc(r.license_fee||'—')));tr.appendChild(td('<span class="pill wait">'+esc(r.status)+'</span>'));tb.appendChild(tr)});}
function partReportFromContract(){var c=$('prc-contract').value.trim();if(!c){toast('契約IDを入力してください',true);return}call('admin_createLicenseReportFromContract',[c,$('prc-partner').value],function(r){toast(r.duplicate?'この契約の報告はすでに起票済みです':'報告を起票しました（期限 '+r.due_date+'）');$('prc-contract').value='';loadPartnership()});}
function partSaveReport(){var x={report_type:$('pr-type').value,partner_id:$('pr-partner').value,due_date:$('pr-due').value,status:$('pr-status').value,subject:$('pr-subject').value,license_summary:$('pr-license').value,usage_detail:$('pr-usage').value,license_fee:$('pr-fee').value,evidence_url:$('pr-url').value,notes:$('pr-notes').value};call('admin_saveSecretariatReport',[x],function(){toast('報告記録を保存しました');loadPartnership()});}
function partRenderSettlements(d){var tb=$('part-settlements');tb.innerHTML='';var rows=d.settlements||[];if(!rows.length){emptyRow(tb,7,'清算記録はありません');return}rows.forEach(function(s){var tr=document.createElement('tr');tr.appendChild(td(esc(s.period_label||s.period_end||'—')));tr.appendChild(td(esc(s.partner_name_snapshot||s.partner_id||'—')));tr.appendChild(td(esc(s.distribution_amount||'—')));tr.appendChild(td(esc(s.expense_share||'—')));tr.appendChild(td(esc(s.net_amount||'—')));tr.appendChild(td(esc(s.due_date||'—')));tr.appendChild(td('<span class="pill wait">'+esc(s.status)+'</span>'));tb.appendChild(tr)});}
function partSaveSettlement(){var x={period_label:$('ps-label').value,partner_id:$('ps-partner').value,due_date:$('ps-due').value,status:$('ps-status').value,revenue_total:$('ps-revenue').value,distribution_amount:$('ps-dist').value,expense_share:$('ps-expense').value,net_amount:$('ps-net').value,allocation_basis:$('ps-basis').value,notes:$('ps-notes').value};call('admin_saveSecretariatSettlement',[x],function(){toast('清算記録を保存しました');loadPartnership()});}
function partRenderMembers(d){var tb=$('part-members');tb.innerHTML='';var rows=d.members||[];if(!rows.length){emptyRow(tb,7,'構成員が登録されていません');return}rows.forEach(function(m){var tr=document.createElement('tr');tr.appendChild(td(esc(m.partner_name_snapshot||m.partner_id||'—')));tr.appendChild(td('<span class="pill '+(m.partner_type==='CORE'?'sign':'wait')+'">'+esc(m.partner_type)+'</span>'));tr.appendChild(td(esc(m.representative_name)));tr.appendChild(td('<span class="id">'+esc(m.representative_email||'—')+'</span>'));tr.appendChild(td(esc(String(m.voting_right)==='true'?'あり':'なし')));tr.appendChild(td(esc(String(m.chair_eligible)==='true'?'あり':'なし')));tr.appendChild(td(esc(m.status)));tb.appendChild(tr)});}
function partSaveMember(){var x={partner_id:$('pp-partner-id').value,partner_name_snapshot:$('pp-partner-name').value,partner_type:$('pp-type').value,representative_name:$('pp-name').value,representative_email:$('pp-email').value,voting_right:$('pp-vote').value==='true',chair_eligible:$('pp-chair').value==='true',status:$('pp-status').value};call('admin_saveSecretariatMember',[x],function(){toast('構成員を保存しました');loadPartnership()});}
function partRefreshSelects(d){var members=d.members||[],meetings=d.meetings||[],agendas=d.agendas||[];partOpt($('pm-chair'),members,'member_id',function(x){return x.representative_name+' / '+x.partner_name_snapshot});partOpt($('pv-member'),members.filter(function(x){return x.status==='ACTIVE'&&String(x.voting_right)==='true'}),'member_id',function(x){return x.representative_name+' / '+x.partner_name_snapshot});partOpt($('pa-meeting'),meetings,'meeting_id',function(x){return String(x.starts_at||'').slice(0,10)+' '+x.title});partOpt($('pv-agenda'),agendas.filter(function(x){return x.status!=='RESOLVED'}),'agenda_id',function(x){return (x.agenda_no?x.agenda_no+' ':'')+x.title+' ['+x.resolution_rule+']'});var ps={};members.forEach(function(x){if(x.partner_id)ps[x.partner_id]=x.partner_name_snapshot||x.partner_id});var pr=[];Object.keys(ps).forEach(function(id){pr.push({id:id,name:ps[id]})});partOpt($('pr-partner'),pr,'id',function(x){return x.name});partOpt($('ps-partner'),pr,'id',function(x){return x.name});partOpt($('prc-partner'),pr,'id',function(x){return x.name});}
</script>
