<script>
(function(){
  const pane=document.getElementById('p-legal');
  if(pane && !document.getElementById('set-guideline')){
    const panel=document.createElement('div'); panel.className='panel';
    panel.innerHTML='<div class="ph"><h3>SPLL二次創作ガイドライン</h3><span class="hint">Legal_Documents: GUIDELINE</span></div>'+
      '<div class="pbody"><p class="setnote">公開ポータルで確認するガイドラインです。利用許諾契約本文への同意はCloudSign上で取得します。</p>'+
      '<div class="fld"><textarea id="set-guideline" class="code" style="min-height:280px" placeholder="SPLL二次創作ガイドライン（HTML）"></textarea></div>'+
      '<p class="setnote" id="v4-status">CloudSign FORM v4設定：確認中…</p></div>';
    const panels=pane.querySelectorAll('.panel');
    if(panels.length>1) pane.insertBefore(panel, panels[1]); else pane.appendChild(panel);
  }

  const legacyTerms=document.getElementById('set-terms');
  if(legacyTerms){
    const legacyPanel=legacyTerms.closest('.panel');
    const guidelinePanel=document.getElementById('set-guideline') && document.getElementById('set-guideline').closest('.panel');
    const versions=document.getElementById('legal-versions');
    if(guidelinePanel && versions) guidelinePanel.querySelector('.pbody').appendChild(versions);
    if(legacyPanel){
      const h=legacyPanel.querySelector('.ph h3'); if(h) h.textContent='v4法務文書の保存・公開';
      const body=legacyPanel.querySelector('.pbody'); if(body) body.style.display='none';
      const buttons=legacyPanel.querySelectorAll('.pfoot button');
      if(buttons[0]) buttons[0].textContent='個人情報・ガイドラインを下書き保存';
      if(buttons[1]) buttons[1].textContent='下書きを公開する（法務承認）';
      if(buttons[2]) buttons[2].style.display='none';
    }
  }

  const formPane=document.getElementById('p-formrun');
  if(formPane){
    const note=formPane.querySelector('.setnote');
    if(note) note.innerHTML='CloudSign FORM v4では、利用者が入力するのは契約者情報のみです。SPLL番号・対象原作・料金・期間・クレジット等は<b>システムhidden項目</b>として契約書へ引き継ぎ、Webhookで改変検知します。';
    const notes=formPane.querySelectorAll('.note');
    if(notes[0]) notes[0].innerHTML='<b>v4設定：</b>「hidden項目ひな形」を挿入し、各canonical keyをFormRunの実フィールドIDへ割り当ててください。逆方向の <span class="mono">FORMRUN_FIELD_MAP</span> も同じ項目で設定します。契約成立はFormRun送信時ではなくCloudSign上の同意完了時です。';
  }
  insertHiddenMapSkeleton=function(){
    const n=parseInt((document.getElementById('fr-max_works')||{}).value||'5',10)||5;
    const o={license_id:'',application_ref:'',handoff_token:'',terms_snapshot_hash:'',contract_template_version:'',usage_category:'',work_count:'',work_names:''};
    for(let i=1;i<=n;i++){ o['work_id_'+i]=''; o['work_title_'+i]=''; }
    ['licensor_name','license_term','territory','fee_model','fee_value','fee_amount_or_rate','licensed_uses','payment_terms','reporting_terms','credit_text','special_terms','template_route'].forEach(function(k){o[k]='';});
    const cur=(document.getElementById('fr-hidden_map')||{}).value||'';
    if(cur.trim() && !confirm('現在のマッピング内容を置き換えますか？')) return;
    document.getElementById('fr-hidden_map').value=JSON.stringify(o,null,2);
    toast('CloudSign FORM v4のhidden項目ひな形を挿入しました');
  };

  const legacyLoadLegal=loadLegal;
  loadLegal=function(){
    legacyLoadLegal();
    call('api_getLegalTextsV4',[],function(l){
      if(l && document.getElementById('set-guideline')) document.getElementById('set-guideline').value=l.guideline||'';
    });
    call('admin_getContractV4Status',[],function(s){
      const el=document.getElementById('v4-status'); if(!el||!s) return;
      const flags=[['PRIVACY公開',s.privacy_published],['GUIDELINE公開',s.guideline_published],['個人FORM URL',s.form_url_individual],['hidden map',s.form_hidden_map],['Webhook map',s.formrun_field_map],['HMAC鍵',s.handoff_secret]];
      el.innerHTML='<b>'+esc(s.contract_template_version||'v4')+'</b> ／ '+flags.map(function(x){return (x[1]?'✓ ':'⚠ ')+esc(x[0]);}).join(' ／ ');
    });
  };

  saveLegalDrafts=function(){
    const privacy=document.getElementById('set-privacy').value;
    const guideline=(document.getElementById('set-guideline')||{}).value||'';
    if(!guideline.trim()){ toast('ガイドライン本文は必須です',true); return; }
    call('admin_saveLegalDraft',['PRIVACY',privacy],function(r1){ _draftIds.PRIVACY=r1.legal_document_id;
      call('admin_saveGuidelineDraft',[guideline],function(r2){ _draftIds.GUIDELINE=r2.legal_document_id;
        toast('下書きを保存しました（個人情報 v'+r1.version+' / ガイドライン v'+r2.version+'）'); loadLegalVersions();
      });
    });
  };

  publishLegalDrafts=function(){
    if(!_draftIds.PRIVACY || !_draftIds.GUIDELINE){ toast('先に個人情報・ガイドラインの「下書き保存」を実行してください',true); return; }
    if(!confirm('個人情報通知とSPLL二次創作ガイドラインを公開します。以後のv4申込はこの版を証跡として記録します。よろしいですか？')) return;
    call('admin_publishLegalDoc',[_draftIds.PRIVACY],function(){
      call('admin_publishLegalDoc',[_draftIds.GUIDELINE],function(){ toast('v4法務文書を公開しました'); _draftIds={}; loadLegal(); });
    });
  };
})();
</script>
