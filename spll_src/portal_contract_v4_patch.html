<script>
(function(){
  // CloudSign FORM v4：ポータルでは契約同意を取らず、ガイドライン確認＋申込内容確定までとする。
  const step2 = document.getElementById('ws2');
  if(step2){
    const h = step2.querySelector('.wtitle'); if(h) h.innerHTML='SPLL二次創作ガイドラインの確認';
    const p = step2.querySelector('.wsub'); if(p) p.textContent='創作・公開・頒布時に守っていただくガイドラインをご確認ください。利用許諾契約への同意は、この後CloudSign上で行います。';
    const c = step2.querySelector('.check .ct'); if(c) c.innerHTML='SPLL二次創作ガイドラインを確認しました<span class="must">必須</span>';
  }
  // 本窓口は個人専用。法人を選んだ場合は申込へ進ませず、個別契約の問い合わせ窓口へ案内する。
  const party = document.getElementById('partySel');
  const corpBox = document.createElement('div');
  corpBox.id = 'corpNotice';
  corpBox.style.cssText = 'display:none;margin-top:10px;border:1px solid var(--brass,#b08a3c);border-radius:9px;padding:12px 13px;font-size:13px;line-height:1.7;background:rgba(176,138,60,.08)';
  if(party){
    const ind = party.querySelector('option[value="INDIVIDUAL"]'); if(ind) ind.textContent='個人（個人事業主を含む）';
    const corp = party.querySelector('option[value="CORPORATION"]'); if(corp) corp.textContent='法人（この窓口の対象外）';
    const sub = party.parentNode.querySelector('.wsub');
    if(sub) sub.textContent='利用料は「利用目的 × 選択した原作」で自動決定されるため、フォームでの条件入力はありません。この窓口は個人（個人事業主を含む）のお申込み専用です。';
    party.parentNode.insertBefore(corpBox, party.nextSibling);
  }
  function renderCorpNotice(){
    const c = (APPLY && APPLY.corporate) || {};
    const links = [];
    if(c.url) links.push('<a href="'+esc(c.url)+'" target="_blank" rel="noopener">法人向けお問い合わせフォーム</a>');
    if(c.email) links.push('<a href="mailto:'+esc(c.email)+'">'+esc(c.email)+'</a>');
    corpBox.innerHTML = '<b>法人のお客様へ</b><br>'+esc(c.note||'法人によるご利用は、本窓口の標準契約とは別に個別契約でのご対応となります。')+
      (links.length ? '<br>'+links.join('　／　') : '<br>お問い合わせ先は事務局までご確認ください。');
  }
  function isCorporate(){ return ((document.getElementById('partySel')||{}).value||'') === 'CORPORATION'; }
  const legacyUpdateN0 = updateN0;
  updateN0 = function(){
    legacyUpdateN0();
    const b = document.getElementById('n0');
    if(isCorporate()){
      renderCorpNotice(); corpBox.style.display='';
      if(b){ b.disabled = true; b.textContent = '法人は個別契約でのご対応となります'; }
    }else{
      corpBox.style.display='none';
      if(b) b.textContent = 'この内容で申込へ進む →';
    }
  };
  if(party) party.addEventListener('change', updateN0);
  updateN0();
  const ws3 = document.getElementById('ws3');
  if(ws3){
    const labels = ws3.querySelectorAll('label.check.oath');
    if(labels[0]) labels[0].querySelector('.ct').innerHTML='私は成年者です。未成年の場合は、事務局の案内する法定代理人同意手続を行います。<span class="must">必須</span>';
    if(labels[1]) labels[1].querySelector('.ct').innerHTML='選択した原作、利用区分その他の申込内容に相違ありません。<span class="must">必須</span>';
    if(labels[2]) labels[2].remove();
    const warn = ws3.querySelector('.warnnote'); if(warn) warn.textContent='契約条件・禁止事項・反社会的勢力排除その他の法的条件は、CloudSignで送付されるSPLL利用許諾契約書をご確認のうえ同意してください。';
  }

  // 法人問い合わせ窓口の設定を取得（index.htmlのローダは corporate を保持しないため）
  if(typeof hasGas !== 'undefined' && hasGas){
    google.script.run.withSuccessHandler(function(c){
      if(c && c.corporate){ APPLY.corporate = c.corporate; if(isCorporate()) renderCorpNotice(); }
    }).api_getApplyConfig();
  }

  // v4法務文書を別APIで取得。legacy APIの非同期応答より優先するため guideline を別プロパティに保持。
  if(typeof hasGas !== 'undefined' && hasGas){
    google.script.run.withSuccessHandler(function(l){
      if(!l) return;
      if(l.privacy) LEGAL.privacy = l.privacy;
      if(l.guideline){
        LEGAL.guideline = l.guideline;
        // 取得が表示より後になった場合に備え、既に開いている確認画面を描画し直す
        const box = document.getElementById('termsText');
        if(box) box.innerHTML = termsHTML();
      }
      LEGAL_META.guideline_doc_id = l.guideline_doc_id || '';
      LEGAL_META.guideline_version = l.guideline_version || '';
      if(l.privacy_doc_id) LEGAL_META.privacy_doc_id = l.privacy_doc_id;
      if(l.privacy_version) LEGAL_META.privacy_version = l.privacy_version;
    }).api_getLegalTextsV4();
  }

  displayHash = function(){
    return 'fnv1a:' + fnv1a(String(LEGAL.privacy || '')) + '-' + fnv1a(String(LEGAL.guideline || ''));
  };
  termsHTML = function(){ return String(LEGAL.guideline || '<p>ガイドラインを読み込み中です。内容が表示されない場合はページを再読み込みしてください。</p>'); };

  buildFormUrl = function(res){
    // 経路別のhidden項目マップは画面側に無いため、URLはサーバーが確定させたものを使う。
    // 以下は form_url_full を返さない旧応答のための組み立て（共通マップのみ）。
    if(res&&res.form_url_full) return res.form_url_full;
    const base=(res&&res.form_url)||APPLY.formUrl; if(!base) return '';
    const map=APPLY.hiddenMap||{}; const params=[];
    const add=(canonical,value)=>{
      const actual=map[canonical]||canonical;
      if(actual) params.push(encodeURIComponent(actual)+'='+encodeURIComponent(value==null?'':String(value)));
    };
    // formrunの初期値つきURLは1000字までのため、載せるのはサーバーが選んだ転送項目だけ。
    // 全条件はSPLL側が内部スナップショットとして保持しており、締結後の照合はそちらで行う。
    add('handoff_token',res&&res.handoff_token||'');
    add('terms_snapshot_hash',res&&res.terms_snapshot_hash||'');
    add('template_route',res&&res.template_route||'');
    const ff=(res&&res.form_fields)||{};
    Object.keys(ff).forEach(k=>add(k,ff[k]));
    return base+(base.indexOf('?')>=0?'&':'?')+params.join('&');
  };

  /**
   * 申込完了画面。
   * この時点では「申込を受け付けた」だけで契約は成立していない。番号を大きく出すと
   * 手続きが終わったように読めてしまうため、残りの手順を常に併記する。
   */
  onCreated = function(res){
    const ref=(res&&res.license_id)||(res&&res.application_ref)||'—';
    document.getElementById('refBox').textContent=ref;
    const done=document.getElementById('doneMsg'); const toForm=document.getElementById('toForm');
    const title=document.getElementById('doneTitle'); const lead=document.getElementById('doneLead');
    const steps=function(items){
      return '<ol style="text-align:left;max-width:44ch;margin:18px auto 0;padding-left:1.4em;line-height:2;">'+
        items.map(function(s){ return '<li>'+s+'</li>'; }).join('')+'</ol>';
    };
    if(title) title.textContent='申込を受け付けました';
    // 進捗表示：申込までを済に、次にやること（契約者情報の入力）を現在地にする。
    // 個別確認へ回った場合は次が事務局の連絡なので、現在地は動かさない。
    const nextIndex = (res && res.template_route === 'MANUAL_REVIEW') ? -1 : 4;
    document.querySelectorAll('#stepper .step').forEach(function(el, i){
      el.classList.toggle('done', i <= 3);
      el.classList.toggle('on', i === nextIndex);
    });
    if(res && res.template_route === 'MANUAL_REVIEW'){
      if(lead) lead.innerHTML='契約はまだ成立していません。事務局の確認をお待ちください。';
      done.innerHTML='今回の申込は、標準の自動締結の対象外です。事務局で内容を確認のうえ、ご連絡します。'+
        '<br><span class="mono" style="font-size:11px">理由：'+esc((res.route_reasons||[]).join('／'))+'</span>'+
        steps(['<b>事務局からのご連絡をお待ちください</b>（このあと当社より対応方法をご案内します）',
               '個別に契約書をお送りします',
               'クラウドサインで契約書にご同意いただいた時点で<b>契約成立</b>']);
      if(res.form_url){ toForm.textContent='個別確認フォームへ進む →'; toForm.onclick=function(){ window.open(buildFormUrl(res),'_blank'); }; toForm.style.display=''; }
      else { toForm.style.display='none'; }
      done.innerHTML+='<div style="margin-top:14px;font-size:12px;color:var(--soft)">SPLL番号は控えとして保管してください。お問い合わせの際に使います。</div>';
    }else{
      if(lead) lead.innerHTML='契約はまだ成立していません。あと2つのお手続きが残っています。';
      done.innerHTML=steps(['<b>クラウドサインフォームで契約者情報をご入力ください</b>（下のボタン。利用条件の再入力はありません）',
                            '入力内容をもとに、クラウドサインから契約書が届きます',
                            '<b>契約書にご同意いただいた時点で契約成立</b>です']);
      const url=buildFormUrl(res);
      if(url){
        toForm.textContent='契約者情報の入力へ進む →'; toForm.onclick=function(){ window.open(url,'_blank'); }; toForm.style.display='';
        done.innerHTML+='<div style="margin-top:14px;font-size:12px;color:var(--warn)">'+
          'この画面を閉じると、このリンクは再表示できません。先にお手続きを済ませてください。</div>';
      }
      else { toForm.style.display='none'; done.innerHTML+='<div style="margin-top:14px;font-size:12px;color:var(--warn)">現在フォームをご案内できません。事務局へお問い合わせください。</div>'; }
      done.innerHTML+='<div style="margin-top:10px;font-size:12px;color:var(--soft)">SPLL番号は控えとして保管してください。申込から契約・審査・認証まで、この番号で管理されます。</div>';
    }
    showWStep('Done');
  };

  submitApplication = function(){
    if(isCorporate()){ renderCorpNotice(); corpBox.style.display=''; goStep(0); alert('法人によるご利用は、この窓口の標準契約とは別に個別契約でのご対応となります。案内先よりお問い合わせください。'); return; }
    const btn=document.getElementById('submit'); btn.disabled=true; btn.textContent='申込を作成中…';
    const params={ workIds:cart.slice(), usageCategory:selectedUsage,
      partyType:(document.getElementById('partySel')||{}).value||'INDIVIDUAL',
      privacyConsent:true, guidelineConsent:true,
      privacyDocumentId:LEGAL_META.privacy_doc_id||'', guidelineDocumentId:LEGAL_META.guideline_doc_id||'',
      consentSessionId:CONSENT_SESSION_ID, displayHash:displayHash() };
    if(hasGas){
      google.script.run.withSuccessHandler(res=>onCreated(res))
        .withFailureHandler(err=>{ btn.disabled=false; btn.textContent='申込を作成してCloudSignへ進む →'; alert('申込の作成に失敗しました：\n'+(err&&err.message||err)); })
        .web_createApplicationV4(params);
    }else{
      onCreated({application_id:'APP-mock',application_ref:'REF-mock',license_id:'SPLL-mock',template_route:'STANDARD_FIXED',form_url:'',form_fields:{}});
    }
  };
  const submit=document.getElementById('submit'); if(submit) submit.onclick=submitApplication;
})();
</script>
