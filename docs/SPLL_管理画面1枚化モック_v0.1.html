<title>SPLL 案件ボード</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: 1枚の業務画面。左=状態ボード / 中央=案件一覧 / 右=詳細とスイッチ。設定・事務局運営は右から出る別パネル */
:root{
  --bg:#eef1f4; --panel:#ffffff; --sunk:#f6f8fa; --ink:#16202b; --muted:#5a6573; --line:#dbe0e6;
  --accent:#0f6d6c; --accent-ink:#ffffff; --accent-soft:#e2f1f0;
  --ok:#1d7a4c; --warn:#9a5c00; --bad:#b0261c; --info:#2f5b94; --idle:#8a939e;
  --paper:#ffffff; --paper-ink:#1b1b1b; --shadow:0 1px 2px rgba(20,30,40,.06),0 6px 24px rgba(20,30,40,.08);
  --f-body:"Noto Sans JP",system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --panel:#192027; --sunk:#141a20; --ink:#e5eaef; --muted:#9aa5b1; --line:#2b333c;
  --accent:#4fb4b1; --accent-ink:#0b1f1f; --accent-soft:#183332;
  --ok:#5cc08a; --warn:#e2a64c; --bad:#ef7d72; --info:#8fb1e2; --idle:#6e7985;
  --paper:#f4f2ec; --paper-ink:#1b1b1b; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --panel:#192027; --sunk:#141a20; --ink:#e5eaef; --muted:#9aa5b1; --line:#2b333c;
  --accent:#4fb4b1; --accent-ink:#0b1f1f; --accent-soft:#183332;
  --ok:#5cc08a; --warn:#e2a64c; --bad:#ef7d72; --info:#8fb1e2; --idle:#6e7985;
  --paper:#f4f2ec; --paper-ink:#1b1b1b; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35); color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.app{height:100%;display:flex;flex-direction:column}

/* header */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:baseline;gap:8px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.brand .seal{font-family:var(--f-mono);font-size:12px;color:var(--accent-ink);background:var(--accent);padding:2px 7px;border-radius:3px;letter-spacing:.08em}
.search{flex:1 1 260px;min-width:0;display:flex}
.search input{width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:7px 12px}
.top .spacer{flex:0 1 auto;min-width:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.who select{max-width:100%}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn:disabled{opacity:.45;cursor:not-allowed}
.who{display:flex;align-items:center;gap:6px;font-size:13px}
.who select{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:5px 8px}
.attn{font-size:13px;border-radius:999px;padding:4px 10px;background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn);font-weight:500;border:0}
.demo-tag{font-size:11px;color:var(--muted);border:1px dashed var(--line);border-radius:4px;padding:1px 6px}

/* main grid */
.main{flex:1;min-height:0;display:grid;grid-template-columns:236px minmax(0,1fr) 420px}
.col{min-height:0;overflow:auto}
.board{border-right:1px solid var(--line);padding:14px 10px 20px 16px;padding-left:max(16px,env(safe-area-inset-left,0px))}
.list{padding:14px 16px 24px}
.detail{border-left:1px solid var(--line);background:var(--panel)}

/* status board */
.bgroup{margin-bottom:14px}
.bgroup h3{font-size:11px;letter-spacing:.12em;color:var(--muted);margin:0 0 4px 8px;font-weight:500}
.brow{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;text-align:left;padding:6px 8px;border-radius:7px}
.brow:hover{background:var(--sunk)}
.brow.on{background:var(--accent-soft);color:var(--ink)}
.brow .lab{flex:1;min-width:0}
.brow .n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.brow .flag{width:7px;height:7px;border-radius:50%;background:transparent;flex:0 0 7px}
.brow.need .flag{background:var(--warn)}
.brow.need .n{color:var(--warn);font-weight:500}
.brow.zero .n{color:var(--idle)}
.bsep{border-top:1px solid var(--line);margin:10px 8px}

/* list */
.lhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 10px;flex-wrap:wrap}
.lhead h2{font-size:16px;margin:0;text-wrap:balance}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.rows{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.r{display:grid;grid-template-columns:128px minmax(0,1.2fr) minmax(0,1.3fr) 150px 136px 76px;gap:10px;align-items:center;padding:9px 14px;border-top:1px solid var(--line);cursor:pointer;width:100%;background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:left}
.r:first-child{border-top:0}
.r.h{cursor:default;font-size:11px;color:var(--muted);letter-spacing:.06em;background:var(--sunk)}
.r:not(.h):hover{background:var(--sunk)}
.r.sel{background:var(--accent-soft)}
.r .who2{min-width:0}
.r .who2 b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r .who2 span{font-size:12px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r .wk{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r .upd{font-size:12px;color:var(--muted);text-align:right}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* pills & axes */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;border-radius:999px;padding:2px 9px;white-space:nowrap;font-weight:500;
  background:color-mix(in srgb,var(--c) 13%,transparent);color:var(--c)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.axes{display:flex;gap:5px}
.ax{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;font-size:11px;font-weight:700;
  background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);font-family:var(--f-mono)}
.c-ok{--c:var(--ok)} .c-warn{--c:var(--warn)} .c-bad{--c:var(--bad)} .c-info{--c:var(--info)} .c-idle{--c:var(--idle)} .c-acc{--c:var(--accent)}

/* detail */
.dempty{padding:40px 24px;color:var(--muted)}
.dhead{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.dhead .id{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.dhead h2{margin:2px 0 4px;font-size:18px;text-wrap:balance}
.dhead .close{margin-left:auto;display:none}
.sec{padding:14px 18px;border-bottom:1px solid var(--line)}
.sec h3{margin:0 0 10px;font-size:12px;letter-spacing:.1em;color:var(--muted);font-weight:500;display:flex;justify-content:space-between;align-items:center;gap:8px}
.states{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center;font-size:13px}
.states dt{color:var(--muted)}
.states dd{margin:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.states .code{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}

.sw{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px dashed var(--line)}
.sw:first-of-type{border-top:0;padding-top:2px}
.sw .t{font-weight:500}
.sw .d{grid-column:1/-1;font-size:12px;color:var(--muted)}
.sw .why{grid-column:1/-1;font-size:12px;color:var(--muted);display:flex;gap:6px}
.sw .why::before{content:"押せない理由";font-size:10.5px;letter-spacing:.05em;border:1px solid var(--line);border-radius:3px;padding:0 4px;white-space:nowrap;height:fit-content}
.sw.locked .why::before{content:"権限なし"}
.sw.off .t{color:var(--muted)}
.tag{font-size:10.5px;border-radius:3px;padding:0 5px;margin-left:6px;vertical-align:1px;border:1px solid var(--line);color:var(--muted);font-weight:400}
.tag.appr{border-color:color-mix(in srgb,var(--info) 50%,var(--line));color:var(--info)}
.tag.future{border-style:dashed}

.toggle{position:relative;width:44px;height:24px;border-radius:999px;border:0;background:var(--line);padding:0;flex:0 0 44px}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.toggle[aria-checked="true"]{background:var(--warn)}
.toggle[aria-checked="true"]::after{left:23px}
.toggle:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:5px 10px;font-size:13px;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button:hover:not(:disabled){background:var(--sunk)}
.seg button:disabled{opacity:.45;cursor:not-allowed}

.pend{grid-column:1/-1;border:1px solid color-mix(in srgb,var(--info) 40%,var(--line));background:color-mix(in srgb,var(--info) 8%,transparent);border-radius:8px;padding:8px 10px;font-size:12.5px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.pend .grow{flex:1 1 160px;min-width:0}

.works{display:grid;gap:6px}
.work{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;font-size:13px}
.work .no{font-family:var(--f-mono);color:var(--muted);font-size:12px;padding-top:1px}
.work small{display:block;color:var(--muted);font-size:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.tl{display:grid;gap:8px;font-size:12.5px}
.tl div{display:grid;grid-template-columns:86px minmax(0,1fr);gap:8px}
.tl time{font-family:var(--f-mono);color:var(--muted);font-size:11.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
details.more summary{cursor:pointer;color:var(--muted);font-size:12px;letter-spacing:.1em;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"▸ ";} details.more[open] summary::before{content:"▾ ";}
.demo{background:var(--sunk)}
.demo h3::after{content:"モック専用";font-size:10.5px;border:1px dashed var(--line);border-radius:3px;padding:0 5px;letter-spacing:0}

/* overlay / drawer / modal */
.scrim{position:fixed;inset:0;background:rgba(10,16,22,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;box-shadow:var(--shadow);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer .dtop{display:flex;gap:10px;align-items:center;padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.drawer .dtop h2{margin:0;font-size:16px}
.tabs{display:flex;gap:4px;margin-left:12px}
.tabs button{border:0;background:transparent;padding:6px 12px;border-radius:7px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--ink);font-weight:500}
.drawer .dbody{flex:1;overflow:auto;padding:16px 18px 30px;display:grid;gap:14px;align-content:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card h4{margin:0 0 8px;font-size:14px}
.setrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.setrow:first-of-type{border-top:0}
.setrow small{grid-column:1/-1;color:var(--muted);font-size:12px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:13px;min-width:460px}
.tbl th,.tbl td{text-align:left;padding:7px 8px;border-top:1px solid var(--line);vertical-align:top}
.tbl th{font-size:11.5px;color:var(--muted);font-weight:500;border-top:0}

.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(460px,calc(100% - 32px));background:var(--panel);border-radius:12px;z-index:51;box-shadow:var(--shadow);padding:18px}
.modal h3{margin:0 0 6px;font-size:16px}
.modal p{margin:0 0 12px;color:var(--muted);font-size:13px}
.modal label{display:block;font-size:12px;color:var(--muted);margin:0 0 4px}
.modal textarea,.modal input,.modal select{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--sunk)}
.modal textarea{min-height:76px;resize:vertical}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.modal .err{color:var(--bad);font-size:12px;min-height:1.2em;margin-top:4px}
.scrim.top{z-index:50}

/* contract preview */
.pv{position:fixed;inset:0;z-index:45;background:color-mix(in srgb,var(--bg) 96%,black);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.pv .ptop{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pv .ptop h2{margin:0;font-size:16px}
.pv .pbody{flex:1;overflow:auto;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:0}
.pv .pages{padding:20px;display:grid;gap:18px;justify-items:center;align-content:start}
.pv .side{border-left:1px solid var(--line);background:var(--panel);padding:16px;font-size:13px;display:grid;gap:14px;align-content:start}
.sheet{width:min(560px,100%);aspect-ratio:210/297;background:var(--paper);color:var(--paper-ink);box-shadow:0 1px 3px rgba(0,0,0,.18),0 10px 30px rgba(0,0,0,.12);
  padding:5.5% 7%;font-size:9.5px;line-height:1.55;display:flex;flex-direction:column;font-family:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;max-width:100%}
.sheet h1{font-size:14px;text-align:center;margin:0 0 10px;letter-spacing:.2em}
.sheet h2{font-size:10.5px;margin:8px 0 4px;border-bottom:1px solid #444;padding-bottom:2px}
.sheet table{border-collapse:collapse;width:100%;font-size:inherit;line-height:1.45}
.sheet td,.sheet th{border:1px solid #888;padding:2px 5px;vertical-align:top;text-align:left;font-weight:400}
.sheet th{background:#efefea;white-space:nowrap;width:24%}
.sheet .wt th{width:auto;text-align:center}
.sheet .wt td:first-child{text-align:right;width:28px;font-family:var(--f-mono)}
.sheet .foot{margin-top:auto;display:flex;justify-content:space-between;font-size:8px;color:#666;font-family:var(--f-mono)}
.sheet p{margin:0 0 4px}
.flow{display:grid;gap:6px;font-family:var(--f-mono);font-size:12px}
.flow div{display:flex;gap:8px;align-items:baseline}
.flow b{font-weight:500;color:var(--accent)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;z-index:60;font-size:13px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}

/* responsive */
@media (max-width:1180px){
  .main{grid-template-columns:220px minmax(0,1fr)}
  .detail{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);z-index:30;box-shadow:var(--shadow);overflow:auto;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
  .detail.closed{display:none}
  .dhead .close{display:inline-block}
}
@media (max-width:760px){
  .main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .board{border-right:0;border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:10px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .bgroup{margin:0;display:flex;gap:6px}
  .bgroup h3,.bsep{display:none}
  .brow{white-space:nowrap;border:1px solid var(--line);background:var(--panel);width:auto}
  .list{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .r{grid-template-columns:minmax(0,1fr) auto;gap:4px 10px}
  .r.h{display:none}
  .r .wk,.r .upd{grid-column:1/-1}
  .r .idc{grid-column:1/2}
  .pv .pbody{grid-template-columns:minmax(0,1fr)}
  .pv .side{border-left:0;border-top:1px solid var(--line)}
  .tabs{margin-left:0}
  .top .lg,.demo-tag{display:none}
  .who{flex:1 1 auto;min-width:0}
}
@media (prefers-reduced-motion:reduce){ .toggle::after{transition:none} }
</style>

<div class="app">
  <header class="top">
    <div class="brand"><span class="seal">SPLL</span>案件ボード <span class="demo-tag">モック・サンプルデータ</span></div>
    <div class="search"><input id="q" type="search" placeholder="SPLL番号・氏名・サークル名・原作名で検索" aria-label="案件を検索"></div>
    <div class="spacer">
      <button class="attn" id="attnBtn" type="button"></button>
      <label class="who" for="actor">操作者
        <select id="actor"></select>
      </label>
      <button class="btn" id="csvBtn" type="button">入金CSVを取り込む</button>
      <button class="btn" id="openSettings" type="button" aria-label="設定・事務局運営">⚙ <span class="lg">設定・事務局運営</span></button>
    </div>
  </header>
  <div class="main">
    <nav class="col board" id="board" aria-label="状態ボード"></nav>
    <section class="col list" aria-label="案件一覧">
      <div class="lhead">
        <h2 id="listTitle">要対応</h2>
        <div class="legend"><span>軸：<b>契</b>約 / <b>別</b>紙 / <b>入</b>金 / <b>審</b>査 / <b>認</b>証</span><span class="c-ok" style="color:var(--ok)">● 完了</span><span style="color:var(--info)">● 進行中</span><span style="color:var(--warn)">● 要対応・停止</span><span style="color:var(--bad)">● 終了・差戻し</span></div>
      </div>
      <div class="rows" id="rows"></div>
    </section>
    <aside class="col detail closed" id="detail" aria-label="案件の詳細"></aside>
  </div>
</div>
<div id="layer"></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ===== 定義（spll_src/12_license_state.gs の状態とイベントに合わせる） ===== */
const CS = {
  APPLICATION_RECEIVED:{l:'申込受付',g:'申込〜別紙',c:'info'},
  MANUAL_REVIEW:{l:'個別確認',g:'申込〜別紙',c:'warn',need:true},
  SIGNING:{l:'別紙の同意待ち',g:'申込〜別紙',c:'info'},
  PAYMENT_PENDING:{l:'入金待ち（前払い）',g:'申込〜別紙',c:'info'},
  HOLD:{l:'条件不一致',g:'申込〜別紙',c:'warn',need:true},
  AWAITING_SUBMISSION:{l:'提出待ち',g:'許諾後',c:'info'},

function switches(c){
  const L = [];
  const pre = ['APPLICATION_RECEIVED','MANUAL_REVIEW','SIGNING','PAYMENT_PENDING','HOLD'];
  // S1 別紙の作成と送信（CloudSign API）
  const ag = PARTS[c.pid].st;
  let sendWhy = '';
  if(c.cs==='SIGNING') sendWhy = `送信済みです（同意待ち・期限 ${expiryOf(c)}）`;
  else if(c.ct==='SIGNED') sendWhy = '別紙は本契約に追加済みです';
  else if(!['APPLICATION_RECEIVED','MANUAL_REVIEW'].includes(c.cs)) sendWhy = `現在地「${CS[c.cs].l}」からは送信できません`;
  else if(ag!=='ACTIVE') sendWhy = '利用許諾契約が有効ではありません';
  L.push({key:'send',grp:'contract',t:'別紙を作成して CloudSign で送る',d:'台帳の条件から別紙（契約番号入り・対象作品を全件）を作り、CloudSign API で送信する。通常は申込の直後に自動で送る。同意で本契約に追加される',kind:'button',role:'OPERATIONS',
    why: sendWhy, extra:'preview'});
  // S2 条件確認
  L.push({key:'confirm',grp:'contract',t:'条件を確認して別紙を有効にする',d:'同意された別紙と台帳の食い違いを法務が確認した後に使う。支払方法に応じて入金待ち／提出待ちへ進む',kind:'button',role:'LEGAL_ADMIN',
    why: c.cs==='HOLD' ? '' : '条件不一致（HOLD）の案件だけが対象です'});
  // S3 審査判定
  const rvFrom = ['REVIEWING','CORRECTION_REQUIRED','MANUAL_REVIEW','CERTIFIED','SUSPENDED'];
  let rvWhy = '';
  if(!c.sub) rvWhy = '作品がまだ提出されていません';
  else if(!rvFrom.includes(c.cs)) rvWhy = `現在地「${CS[c.cs].l}」では判定できません`;
  else if(!['IN_REVIEW','PENDING','ESCALATED'].includes(c.rv)) rvWhy = `判定済みです（${RV[c.rv][0]}）。新しい版が提出されると再び判定できます`;
  L.push({key:'review',grp:'review',t:'審査判定',d:'承認すると認証を発行し、バッジ生成ジョブを登録する',kind:'seg',role:'REVIEWER',why:rvWhy});
  // S4 入金未確認で停止（担当者1名／設定で2名承認へ）
  const feeOn = c.ce==='SUSPENDED' && c.reason==='FEE_PAYMENT_UNCONFIRMED';
  let feeWhy = '';
  if(!(c.ce==='ACTIVE' || feeOn)) feeWhy = c.ce==='SUSPENDED' ? '別の理由で停止中です（下の「一時停止・復帰」で扱う）' : '有効な認証がありません';
  L.push({key:'fee',grp:'cert',t:'入金未確認で停止',d: (c.ps==='OVERDUE'?'後払いの支払期限を過ぎて未入金。':'') + (S.feeHoldTwoPerson ? '2名体制：申請 → 別の担当者が承認して切り替わる' : '担当者1名で切り替えられる（今後、2名承認へ移行予定）'),
    kind: S.feeHoldTwoPerson ? 'request' : 'toggle', on:feeOn, role:'OPERATIONS', why:feeWhy, appr:S.feeHoldTwoPerson, future:!S.feeHoldTwoPerson});
  // S5 一時停止（その他）・復帰
  let stWhy='', stMode='';
  if(c.ce==='ACTIVE'){ stMode='suspend'; }
  else if(['SUSPENDED','EXPIRED','REVOKED'].includes(c.ce) && !feeOn){ stMode='restore'; if(c.ct!=='SIGNED') stWhy='終了済みの契約では再有効化できません。再開は新しい契約の締結で行います'; }
  else stWhy = feeOn ? '入金未確認の停止は上のスイッチで扱います' : '認証が発行されていません';
  L.push({key:'suspend',grp:'cert',t: stMode==='restore' ? (c.ce==='REVOKED'?'失効からの再有効化':'停止からの復帰') : '一時停止（入金以外の理由）',
    d:'申請 → 別の担当者（法務）が承認して切り替わる',kind:'request',role:'LEGAL_ADMIN',why:stWhy,appr:true,mode:stMode||'suspend'});
  // S6 失効
  L.push({key:'revoke',grp:'cert',t:'認証を失効させる',d:'申請 → 別の担当者（法務）が承認。バッジの配布も止まる',kind:'request',role:'LEGAL_ADMIN',appr:true,
    why: certLive(c.ce) ? '' : '有効または停止中の認証がありません'});
  // S7 契約終了
  L.push({key:'terminate',grp:'contract2',t:'別紙を取り消す',d:'申請 → 別の担当者（法務）が承認。この SPLL番号（作品）の許諾だけが終わる。終了後は認証を再有効化できない',kind:'request',role:'LEGAL_ADMIN',appr:true,
    why: c.ct==='SIGNED' ? '' : '本契約に追加済みの別紙がありません'});
  L.push({key:'endmaster',grp:'contract2',t:'利用許諾契約を終了する',d:'申請 → 別の担当者（法務）が承認。この契約のすべての別紙（許諾）も終わる',kind:'request',role:'LEGAL_ADMIN',appr:true,
    why: ag==='ACTIVE' ? '' : '有効な利用許諾契約がありません'});
  // S9 申込取消
  L.push({key:'cancel',grp:'contract2',t:'申込を取り消す',d:'許諾が有効になる前の申込を取り消す（同意待ちなら CloudSign の書類も取り消す。SPLL番号は欠番として残る）',kind:'button',role:'OPERATIONS',danger:true,
    why: pre.includes(c.cs) ? '' : '許諾が有効になる前の申込だけが対象です'});
  return L;
}

function swRow(s,c){

  if(s.kind==='toggle') ctl = `<button class="toggle" role="switch" aria-checked="${s.on}" aria-label="${esc(s.t)}" data-sw="${s.key}" ${off?'disabled':''}></button>`;

/* ===== 遷移の適用（本番では admin_applySwitch が既存関数へ振り分ける） ===== */
function log(c,e,w){ c.tl.push({t:now(),w:w||actor().name,e}); c.updated=now(); }
function toast(m){ const t=$('#toast'); t.textContent=m; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,2600); }
function returnFromCert(c){ // 認証の状態に応じて現在地を戻す（CERTIFICATE_RESTORED の挙動）
  const byReview = {IN_REVIEW:'REVIEWING',PENDING:'REVIEWING',CORRECTION_REQUIRED:'CORRECTION_REQUIRED',ESCALATED:'MANUAL_REVIEW'};
  if(['CERTIFIED','SUSPENDED','TERMINATED'].includes(c.cs)) c.cs = byReview[c.rv] || 'CERTIFIED';
}
const APPLY = {
  send(c,w){ c.ct='SIGNING'; c.cs='SIGNING'; c.sent=TODAY; c.note='';
    log(c,`別紙を作成し CloudSign API で送信（${c.works.length}作品・${pageCount(c.works.length)}ページ・同意期限 ${addMonths(TODAY,3)}）`, w==='system'?'system':undefined); return '別紙を CloudSign で送信しました。同意待ちです'; },
  confirm(c,f){ c.note=''; afterAgree(c); log(c,'条件確認済み：'+f.text); return c.pay==='PREPAID' ? '別紙を有効にしました。入金待ちです' : '別紙を有効にしました。提出待ちです'; },
  review(c,f){
    if(f.v==='CLEARED'){
      c.rv='CLEARED';
      if(c.ce==='NOT_ISSUED'){ c.ce='ACTIVE'; c.cs='CERTIFIED'; log(c,'人手審査：承認 → 認証を発行、バッジ生成ジョブを登録'); return '承認しました。認証を発行しました'; }
      c.cs = c.ce==='ACTIVE' ? 'CERTIFIED' : 'SUSPENDED'; log(c,'人手審査：承認（再審査）'); return '承認しました';
    }
    if(f.v==='CORRECTION_REQUIRED'){ c.rv='CORRECTION_REQUIRED'; c.cs='CORRECTION_REQUIRED'; log(c,'人手審査：是正を依頼 — '+f.text); return '是正を依頼しました'; }
    c.rv='ESCALATED'; c.cs='MANUAL_REVIEW'; log(c,'人手審査：上申 — '+f.text); return '上申しました';
  },
  fee(c,f){
    if(c.ce==='ACTIVE'){ c.ce='SUSPENDED'; c.reason='FEE_PAYMENT_UNCONFIRMED'; if(c.cs==='CERTIFIED') c.cs='SUSPENDED'; log(c,'入金未確認で停止 — '+(f.text||'')); return '認証を停止しました（入金未確認）'; }
    c.ce='ACTIVE'; c.reason=''; returnFromCert(c); log(c,'入金を確認し復帰 — '+(f.text||'')); return '認証を復帰しました';
  },
  cancel(c,f){ c.cs='CANCELLED'; log(c,'申込取消 — '+f.text); return '申込を取り消しました'; }
};
/** 別紙が本契約に追加された後の行き先：前払いは入金待ち、後払いはすぐ提出待ち */
function afterAgree(c){
  c.ct='SIGNED';
  if(c.pay==='PREPAID'){ c.cs='PAYMENT_PENDING'; c.ps='UNPAID'; }
  else { c.cs='AWAITING_SUBMISSION'; c.rv='AWAITING_SUBMISSION'; c.ps='UNPAID'; c.due=c.due||addDays(TODAY,90); }
}
function applyRequest(c){
  const r = c.req; const ap = actor().name;
  if(r.kind==='revoke'){ c.ce='REVOKED'; c.cs='TERMINATED'; log(c,`認証を失効（承認：${ap}）`); }
  else if(r.kind==='suspend'){ c.ce='SUSPENDED'; c.reason=r.reason; if(c.cs==='CERTIFIED') c.cs='SUSPENDED'; log(c,`一時停止（承認：${ap}）`); }
  else if(r.kind==='restore'){ c.ce='ACTIVE'; c.reason=''; returnFromCert(c); log(c,`再有効化（承認：${ap}）`); }
  else if(r.kind==='terminate'){ c.cs='TERMINATED'; c.ct='TERMINATED'; if(c.ce!=='NOT_ISSUED') c.ce='TERMINATED'; log(c,`別紙を取消し（承認：${ap}）`); }
  else if(r.kind==='endmaster'){
    PARTS[c.pid].st='TERMINATED';
    CASES.filter(x=>x.pid===c.pid).forEach(x=>{
      if(['TERMINATED','CANCELLED'].includes(x.cs)) return;
      if(x.ct==='SIGNED'){ x.ct='TERMINATED'; x.cs='TERMINATED'; if(x.ce!=='NOT_ISSUED') x.ce='TERMINATED'; }
      else x.cs='CANCELLED';
      log(x,`利用許諾契約の終了に伴い終了（承認：${ap}）`);
    });
  }
  else if(r.kind==='fee_on'){ c.ce='SUSPENDED'; c.reason='FEE_PAYMENT_UNCONFIRMED'; if(c.cs==='CERTIFIED') c.cs='SUSPENDED'; log(c,`入金未確認で停止（承認：${ap}）`); }
  else if(r.kind==='fee_off'){ c.ce='ACTIVE'; c.reason=''; returnFromCert(c); log(c,`入金確認で復帰（承認：${ap}）`); }
  c.req = null;
}

function dialog(o){

  L.innerHTML = `<div class="scrim top" data-close="1"></div><div class="modal" role="dialog" aria-modal="true" aria-labelledby="dlgT">
    <h3 id="dlgT">${esc(o.title)}</h3><p>${esc(o.body)}</p>${reasonSel}
    ${o.input?`<label for="dlgText">${esc(o.input)}${o.required?'（必須）':''}</label><textarea id="dlgText"></textarea>`:''}
    <div class="err" id="dlgErr"></div>
    <div class="acts"><button class="btn" type="button" data-close="1">やめる</button><button class="btn ${o.danger?'danger':'primary'}" type="button" id="dlgOk">${esc(o.ok||'実行')}</button></div></div>`;
  const t = $('#dlgText'); (t||$('#dlgOk')).focus();
  $('#dlgOk').onclick = () => {

    const reason = $('#dlgReason') ? $('#dlgReason').value : '';

  };

function onSwitch(key,val){
  const c = CASES.find(x=>x.id===S.sel); const s = switches(c).find(x=>x.key===key);
  if(!s || s.why || !can(s.role)) return;
  const run = f => { const m = APPLY[key](c,Object.assign({v:val},f)); render(); toast(m); };
  if(key==='send') return openPreview(c,{send:true});
  if(key==='confirm') return dialog({title:'条件を確認して別紙を有効にする',body:`${c.id} を${c.pay==='PREPAID'?'入金待ち':'提出待ち'}へ進めます。確認した内容を残してください。`,input:'確認メモ',required:true,ok:'有効にする',done:run});
  if(key==='review'){
    if(val==='CLEARED') return dialog({title:'審査を承認する',body:'承認すると認証を発行し、バッジ生成ジョブを登録します。審査完了のメールが送られます。',input:'審査コメント（任意）',ok:'承認する',done:run});
    return dialog({title: val==='ESCALATED'?'上申する':'是正を依頼する',body: val==='ESCALATED'?'個別確認（法務）へ回します。':'クリエーターへ是正内容を伝えます。',input: val==='ESCALATED'?'上申の理由':'是正してほしい内容',required:true,ok:val==='ESCALATED'?'上申する':'是正を依頼する',done:run});
  }
  if(key==='fee'){
    if(s.kind==='toggle') return dialog({title: s.on?'入金を確認して復帰する':'入金未確認で停止する',body: s.on?'認証を有効に戻し、バッジの配布を再開します。':'認証を停止します。停止中はバッジを配布しません。',input:'メモ（任意）',ok:s.on?'復帰する':'停止する',danger:!s.on,done:run});
    return dialog({title: s.on?'復帰を申請する':'停止を申請する',body:'2名体制：別の担当者が承認した時点で切り替わります。',input:'申請の内容',required:true,ok:'申請する',done:f=>{ c.req={kind:s.on?'fee_off':'fee_on',reason:'FEE_PAYMENT_UNCONFIRMED',text:f.text,by:S.actor,at:now()}; log(c,'申請：'+(s.on?'入金確認で復帰':'入金未確認で停止')); render(); toast('申請しました。承認待ちです'); }});
  }
  if(['suspend','revoke','terminate','endmaster'].includes(key)){
    const kind = key==='suspend' ? s.mode : key;
    const titles = {suspend:'一時停止を申請する',restore:'再有効化を申請する',revoke:'失効を申請する',terminate:'別紙の取消しを申請する',endmaster:'利用許諾契約の終了を申請する'};
    return dialog({title:titles[kind],body:'別の担当者（法務）が承認した時点で切り替わります。',reasons: kind==='restore'?null:['GUIDELINE_REVIEW','RIGHTS_CLAIM','OTHER'],input:'申請の内容',required:true,ok:'申請する',danger:kind!=='restore',
      done:f=>{ c.req={kind,reason:f.reason||'OTHER',text:f.text,by:S.actor,at:now()}; log(c,'申請：'+titles[kind].replace('を申請する','')); render(); toast('申請しました。承認待ちです'); }});
  }
  if(key==='cancel') return dialog({title:'申込を取り消す',body:`${c.id} を取消にします。元には戻せません。`,input:'取消の理由',required:true,ok:'取り消す',danger:true,done:run});
}

const FIRST_ROWS = 9, NEXT_ROWS = 30;
function pageCount(n){ return 1 + (n>FIRST_ROWS ? Math.ceil((n-FIRST_ROWS)/NEXT_ROWS) : 0) + 1; }
function hash(s){ let h=0x811c9dc5; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; } return h.toString(16).padStart(8,'0'); }

/* ===== 入金CSVの取込（S11）：取込 → 照合結果の確認 → 反映 ===== */
function sampleCsv(){
  const open = CASES.filter(c=>['UNPAID','OVERDUE'].includes(c.ps) && c.cs!=='HOLD').sort((x,y)=>(y.cs==='PAYMENT_PENDING')-(x.cs==='PAYMENT_PENDING'));
  const rows = ['日付,金額,振込名義'];
  open.slice(0,3).forEach((c,i)=>rows.push(`2026-11-1${i+4},${c.amount},${c.id.slice(10)} ${c.party.replace(' ','')}`));
  rows.push('2026-11-16,16500,ﾔﾏﾓﾄ ﾀﾛｳ');
  if(open[0]) rows.push(`2026-11-16,${open[0].amount+1000},${open[0].id.slice(10)} ${open[0].party.replace(' ','')}`);
  return rows.join('\n');
}
function matchCsv(text){
  return text.trim().split(/\r?\n/).slice(1).filter(Boolean).map(line=>{
    const [date,amt,name] = line.split(','); const amount = +amt; const key = hash(line);
    const m = String(name||'').match(/^(\d{4})/); const c = m ? CASES.find(x=>x.id.slice(10)===m[1]) : null;
    let st='ok', why='';
    if(IMPORTED.has(key)){ st='dup'; why='取込済みの行（二重反映しない）'; }
    else if(!c){ st='ng'; why='振込名義に SPLL番号がない'; }
    else if(!['UNPAID','OVERDUE'].includes(c.ps)){ st='ng'; why='この案件は入金待ちではない'; }
    else if(c.cs==='HOLD'){ st='ng'; why='条件不一致の確認中（確認後に反映）'; }
    else if(amount!==c.amount){ st='ng'; why=`金額が合わない（請求 ${c.amount.toLocaleString()}円）`; }
    else why = c.pay==='PREPAID' ? '前払い：入金待ち → 提出待ち' : (c.ps==='OVERDUE'?'後払い：期限超過分の入金（認証の復帰は S4 で）':'後払い：入金を記録');
    return {date,amount,name,key,c,st,why};
  });
}
function openCsv(){
  if(!can('OPERATIONS')){ toast('入金CSVの取込には運用の権限が必要です'); return; }
  const L = $('#layer');
  L.innerHTML = `<div class="scrim" data-close="1"></div><div class="drawer" role="dialog" aria-modal="true" aria-labelledby="csvT">
    <div class="dtop"><h2 id="csvT">入金CSVを取り込む</h2><button class="btn" type="button" data-close="1" style="margin-left:auto">閉じる</button></div>
    <div class="dbody">
      <div class="card"><h4>1. CSVを貼り付ける（モックではサンプルを入れてあります）</h4>
        <label for="csvText" class="muted" style="font-size:12px">列：日付,金額,振込名義（振込名義の先頭に SPLL番号の下4桁）</label>
        <textarea id="csvText" style="width:100%;min-height:130px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--sunk);font-family:var(--f-mono);font-size:12.5px">${esc(sampleCsv())}</textarea>
        <div style="margin-top:8px"><button class="btn primary" type="button" id="csvMatch">照合する</button></div></div>
      <div class="card" id="csvResult"><h4>2. 照合結果</h4><div class="muted" style="font-size:13px">「照合する」を押すと、ここに行ごとの結果が出ます。</div></div>
    </div></div>`;
  $('#csvMatch').onclick = () => {
    const rows = matchCsv($('#csvText').value);
    const okN = rows.filter(r=>r.st==='ok').length;
    $('#csvResult').innerHTML = `<h4>2. 照合結果（反映できる行 ${okN} / ${rows.length}）</h4><div class="tbl"><table><thead><tr><th>日付</th><th>金額</th><th>振込名義</th><th>結果</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td class="mono">${esc(r.date)}</td><td class="mono">${r.amount.toLocaleString()}</td><td>${esc(r.name)}${r.c?'<br><span class="muted mono" style="font-size:11.5px">'+r.c.id+'</span>':''}</td><td>${r.st==='ok'?pill('反映する','ok'):(r.st==='dup'?pill('スキップ','idle'):pill('未照合','warn'))}<div class="muted" style="font-size:12px">${esc(r.why)}</div></td></tr>`).join('')}
      </tbody></table></div><div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" type="button" id="csvApply" ${okN?'':'disabled'}>${okN}件を反映する</button><span class="muted" style="font-size:12px;align-self:center">未照合の行は「未照合の入金」に残ります</span></div>`;
    $('#csvApply').onclick = () => {
      rows.forEach(r=>{
        if(r.st==='ok'){ const c=r.c; IMPORTED.add(r.key); c.ps='PAID'; c.paidAt=r.date;
          if(c.cs==='PAYMENT_PENDING'){ c.cs='AWAITING_SUBMISSION'; c.rv='AWAITING_SUBMISSION'; log(c,'入金CSV：入金を確認 → 許諾が有効（提出待ち）'); }
          else log(c,'入金CSV：入金を記録'+(c.ce==='SUSPENDED'&&c.reason==='FEE_PAYMENT_UNCONFIRMED'?'（認証の復帰は S4 で）':'')); }
        else if(r.st==='ng'){ IMPORTED.add(r.key); UNMATCHED.push({date:r.date,amount:r.amount,name:r.name,why:r.why}); }
      });
      L.innerHTML=''; render(); toast(`${okN}件を反映しました。未照合 ${rows.filter(r=>r.st==='ng').length}件は要対応に残しました`);
    };
  };
}

    return;
  }
  if(t.dataset.op){ const c = CASES.find(x=>x.id===S.sel); const m={guide:'専用ページのリンクを再発行し、登録メールへ送りました（旧リンクは失効）',badge:'バッジ生成ジョブを再登録しました',code:'照合コードを再発行しました'}[t.dataset.op]; log(c,m); renderDetail(); toast(m); return; }
  if(t.dataset.demo){
    const c = CASES.find(x=>x.id===S.sel);
    if(t.dataset.demo==='agree'){ afterAgree(c); c.agreed=TODAY; log(c,'別紙の締結 Webhook：同意・照合コード一致 → 本契約に追加','cloudsign');
      toast(c.pay==='PREPAID' ? '別紙が本契約に追加されました。前払いのため入金待ちです' : '別紙が本契約に追加されました。後払いのため許諾が有効、提出待ちです'); }
    else if(t.dataset.demo==='expire'){ const why = c.cs==='SIGNING' ? '別紙の同意期限（送信から3か月）' : '前払いの入金期限（追加から3か月）'; c.cs='CANCELLED'; if(c.ct==='SIGNING') c.ct='NOT_STARTED'; log(c,why+'を過ぎたため取消','system'); toast('期限切れで取り消しました'); }
    else { c.sub = {title:(c.sub?c.sub.title:'新しい作品'),ver:(c.sub?c.sub.ver+1:1),ai:'指摘なし'}; c.rv='IN_REVIEW'; c.cs='REVIEWING'; log(c,'作品提出（第'+c.sub.ver+'版）→ AI一次審査完了','upload'); toast('提出を受け付けました。審査中になりました'); }
    render(); return;
  }
});
document.addEventListener('keydown', e => { if(e.key==='Escape') $('#layer').innerHTML=''; });
if(window.matchMedia('(min-width:1181px)').matches) $('#detail').classList.remove('closed');
render();
</script>
